<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LexiForge — AI Language & Creation Suite</title>
<meta name="description" content="LexiForge: chat, writing, image, coding, SEO, social media, marketing, business and logo tools — free AI, one workspace.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="rack" id="rack">
  <div class="rack-head">
    <img class="brand-mark" src="logo.svg" alt="LexiForge">
    <div class="rack-sub">AI Language &amp; Creation Suite</div>
  </div>
  <nav class="pegboard" id="pegboard"></nav>
</div>

<main class="bay">
  <button class="hamburger" id="hamburger" aria-label="Open tools">☰</button>

  <header class="topbar">
    <h1 id="toolTitle">AI Chat</h1>
    <p class="topbar-sub" id="toolSub">Ask anything</p>
  </header>

  <div class="log-scroll" id="logScroll">
    <div class="examples" id="examples"></div>
    <div class="chat-log" id="chatLog"></div>
  </div>

  <div class="composer-dock">
    <form id="toolForm" class="composer">
      <div class="attach-row" id="attachRow" hidden>
        <div class="attach-chip" id="attachChip">
          <img id="attachThumb" src="" alt="attached image">
          <button type="button" id="attachRemove" aria-label="Remove attachment">✕</button>
        </div>
      </div>
      <textarea id="toolInput" rows="1" placeholder="Type here..." required></textarea>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <button type="button" class="attach-btn" id="attachBtn" aria-label="Attach image">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="mic-btn" id="micBtn" aria-label="Voice input">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="9" y="2" width="6" height="12" rx="3" stroke="currentColor" stroke-width="2"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button type="submit" class="run-btn" id="runBtn" aria-label="Generate">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>
    <div class="status" id="status"></div>
  </div>
</main>

<div class="scrim" id="scrim"></div>

<script src="app.js"></script>
</body>
</html>
